<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pak-lawgpt — The Contract Act, 1872</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="app-header">
    <span class="app-header__badge">⚖</span>
    <div>
      <h1>pak-lawgpt</h1>
      <p>The Contract Act, 1872</p>
    </div>
  </header>

  <main id="chat" class="chat">
    <div id="welcome" class="welcome">
      <h2>What do you want to know about the Contract Act?</h2>
      <div class="suggestions">
        <button class="suggestion" type="button">What is consideration?</button>
        <button class="suggestion" type="button">Who is competent to contract?</button>
        <button class="suggestion" type="button">Is an agreement without consideration void?</button>
        <button class="suggestion" type="button">What is a voidable contract?</button>
      </div>
    </div>
  </main>

  <form id="form" class="composer-wrap">
    <div class="composer">
      <input id="question" type="text" placeholder="Ask about the Contract Act, 1872..." autocomplete="off" required />
      <button id="send" class="send-btn" type="submit" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 19V5M12 5L5 12M12 5l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
    <p class="disclaimer">Answers are grounded in the Contract Act, 1872 only and may be incomplete.</p>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
